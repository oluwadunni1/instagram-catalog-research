name: r2_jev_cascade
description: >-
  Round 2: the Stage 2 cascade with Jev on both tiers, now that Jev accepts images
  (docs.typesafe.ai/images, "dreamer-ready"). Text first; a caption-less post goes
  straight to Jev with its photo, and a captioned one goes to the photo only when text
  confidence is under escalate_below. This is the hybrid's shape with Gemini taken out:
  round 1's Jev misses were mostly caption-less posts it could not see.
  Binary product-vs-not, run with --only-stage 2. Jev calls go straight to TypeSafe
  (pipeline/jev_client.py, TYPESAFE_API_KEY), never through OpenRouter, so they are
  outside ROUND_BUDGET_USD. Pinned to jev-1.13.0, which jev-latest resolved to for every
  2026-10-16 run: images are a beta, so an alias move could change answers unseen. Gate with
  --expect-model jev-1.13.0.

  Scoring note that travels with any number from this config: Jev picks between 2
  options while the Gemini stage picks between 5, so part of any Jev advantage is the
  smaller option set. Compare on the binary product-vs-not metric only.

stage2_triage:
  module: pipeline.stages.stage2_triage_jev
  function: triage_post_jev
  jev_model: jev-1.13.0
  threshold: 0.5
  image_policy: escalate
  escalate_below: 0.80
  model: Jev Cascade (TypeSafe)
  cost_per_call_usd: 0.0

# REQUIRED BY THE SCHEMA, NEVER INVOKED: run with --only-stage 2. Kept on the
# round-2 control's models so a full run would hit the known-good path.
stage3_extract:
  module: pipeline.stages.stage3_extract
  function: extract_product
  text_model: openrouter/google/gemini-3.5-flash-lite
  vision_model: openrouter/google/gemini-3.5-flash-lite
  model: Gemini control (OpenRouter)
  cost_per_call_usd: 0.0
  note: Not part of this experiment. Present only because ExperimentConfig requires it.
